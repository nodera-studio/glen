[package]
name = "glen"
version = "0.1.0"
edition = "2024"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
clap_complete = "4.6.11"
comfy-table = { version = "8.0.1", features = ["custom_styling"] }
dirs = "7.0.0"
indicatif = "0.18.6"
jiff = "0.2.38"
omp-rpc = { git = "https://github.com/can1357/oh-my-pi", tag = "v18.14.0", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
terminal_size = "0.4.4"
thiserror = "2.0.21"
unicode-width = "0.2.3"
uuid = { version = "1.29.0", features = ["v7"] }
xxhash-rust = { version = "0.8.18", features = ["xxh64"] }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
rustix = { version = "1.1.6", features = ["fs", "net", "process"] }
signal-hook = "0.3.18"

[[example]]
name = "fake_omp"
path = "tests/support/fake_omp.rs"

[[example]]
name = "fake_ext"
path = "tests/support/fake_ext.rs"
