[package]
name = "glen"
version = "0.1.0"
edition = "2024"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
clap_complete = "4.6.11"
comfy-table = { version = "8.0.1", features = ["custom_styling"] }
dirs = "7.0.0"
indicatif = "0.18.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
terminal_size = "0.4.4"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
