name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # caches ~/.cargo/registry, ~/.cargo/git (the omp-rpc git dep from W2 is a ~1.5 GB clone) and target; saved on failure too
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - if: runner.os == 'Linux'
        run: (command -v shellcheck || sudo apt-get install -y shellcheck) && shellcheck --version && shellcheck -s sh install.sh scripts/package-release.sh scripts/flake-check.sh
      - run: cargo test --locked
      # Publish the populated git checkout for release jobs, once on main.
      # Check for an existing key without downloading over the checkout again.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: omp-git-v1-${{ hashFiles('Cargo.lock') }}
          lookup-only: true

  linux-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-sandbox
          cache-on-failure: true
      - name: bubblewrap (fails, never skips)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --version
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-net -- \
            sh -c 'touch "$HOME/.glen-ro-probe" 2>&1 | grep -q "Read-only file system"'
      - run: cargo build --locked --bins --examples
      - run: cargo test --locked --test linux_sandbox -- --ignored --test-threads=1

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:unit
      - run: npm run budgets
      - run: npm run links
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('site/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run lhci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: site-reports
          path: |
            site/dist/
            site/.lighthouseci/
            site/playwright-report/
            site/test-results/
          include-hidden-files: true
          if-no-files-found: ignore

  site-deploy:
    needs: [check, site]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: site-deploy-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: site
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc
      - uses: actions/download-artifact@v8
        with:
          name: site-reports
          path: site
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/check-links.mjs --online
      - run: npx --yes wrangler@4.124.0 deploy --dry-run
      - id: token
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "present=$([ -n "$T" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.token.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          main_sha=$(git ls-remote --exit-code origin refs/heads/main)
          main_sha=${main_sha%%[[:space:]]*}
          if [ "$GITHUB_SHA" != "$main_sha" ]; then
            echo '::notice title=Site deploy skipped::newer commit on main; skipping'
            exit 0
          fi
          npx --yes wrangler@4.124.0 deploy
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.token.outputs.present == 'false'
        run: echo "::notice title=Site deploy skipped::CLOUDFLARE_API_TOKEN is not set; the owner deploys with npm --prefix site run deploy"
