name: flake-proof

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  proof:
    if: github.event.label.name == 'flake-proof'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # The label-triggered default checks out refs/pull/N/merge; AC-1013 wants the
          # proof recorded against the PR's own head SHA, not the ephemeral merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: scripts/flake-check.sh 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flake-proof-${{ matrix.os }}
          path: target/flake-check/
