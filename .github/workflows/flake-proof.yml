name: flake-proof

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  proof:
    if: github.event.label.name == 'flake-proof'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # The label-triggered default checks out refs/pull/N/merge; AC-1013 wants the
          # proof recorded against the PR's own head SHA, not the ephemeral merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      # The toolchain comes from rust-toolchain.toml (W8 DEBT-7).
      - id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - run: scripts/flake-check.sh 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flake-proof-${{ matrix.os }}
          path: target/flake-check/
