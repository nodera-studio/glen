    glen_reply: allow
    mcp__mnemosyne_memory_search: allow
    mcp__mnemosyne_memory_get: allow
    mcp__mnemosyne_memory_list: allow
    mcp__mnemosyne_memory_get_recent: allow
    mcp__mnemosyne_memory_get_entity: allow
    mcp__mnemosyne_memory_decision_chain: allow
    mcp__mnemosyne_memory_edit: deny
    mcp__mnemosyne_memory_reflect: deny
